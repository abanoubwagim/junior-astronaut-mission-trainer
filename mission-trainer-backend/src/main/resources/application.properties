spring.application.name=moonbase-mission-trainer
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# External science configuration. DONKI is public and does not require API_KEY;
# the key is bound for future NASA services but is never sent to the frontend or
# logged by the current integration.
nasa.api-key=${NASA_API_KEY:${API_KEY:}}
nasa.donki-base-url=${NASA_DONKI_BASE_URL:https://ccmc.gsfc.nasa.gov/DONKI-API}
nasa.connect-timeout=${NASA_CONNECT_TIMEOUT:2s}
nasa.read-timeout=${NASA_READ_TIMEOUT:4s}
nasa.cache-ttl=${NASA_CACHE_TTL:15m}
nasa.lookback-days=${NASA_LOOKBACK_DAYS:30}
nasa.fallback-resource=${NASA_FALLBACK_RESOURCE:nasa-evidence/donki/sep-2016-01-02.json}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
